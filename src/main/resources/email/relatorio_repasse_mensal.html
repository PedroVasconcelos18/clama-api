<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Repasse do ciclo {{ciclo}}</title></head>
<body style="font-family:Arial, sans-serif; font-size:14px; color:#222;">
  <h2 style="margin:0 0 12px 0;">Repasse do ciclo {{ciclo}}</h2>
  <h3 style="margin:16px 0 4px 0;">Instituições</h3>
  <pre style="font-family:inherit; white-space:pre-wrap;">{{instituicoes}}</pre>
  <p><b>Faltou:</b> {{faltou}}</p>
  <h3 style="margin:16px 0 4px 0;">Ledger</h3>
  <pre style="font-family:inherit; white-space:pre-wrap;">{{ledger}}</pre>
  <h3 style="margin:16px 0 4px 0;">Estornos a acertar</h3>
  <pre style="font-family:inherit; white-space:pre-wrap;">{{estornos}}</pre>
  <p><a href="{{link}}">Baixar os relatórios e marcar as transferências</a></p>
</body>
</html>
