spring:
  application:
    name: clama-api
  jackson:
    time-zone: America/Sao_Paulo
  servlet:
    multipart:
      # Django nao limita o upload no parser; quem recusa e o serializer (logo 250 KB, documento 100 MB)
      max-file-size: 100MB
      max-request-size: 101MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # banco de producao ja existe (Django): baseline em 0 e so migrations aditivas por cima
    baseline-on-migrate: true
    baseline-version: "0"
clama:
  fila:
    polling: 2s
    heartbeat: 20s # x6 perdidos (default do db-scheduler) = execucao morta retomada em ~2 min
