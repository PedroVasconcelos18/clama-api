server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

spring:
  datasource:
    hikari:
      data-source-properties:
        # sem estes timeouts o proxy publico do Railway ja travou uma conexao para sempre (incidente 2026-11-08)
        connectTimeout: "10"
        loginTimeout: "20"
        tcpKeepAlive: "true"
        logServerErrorDetail: "false"
  application:
    name: clama-api
  session:
    jdbc:
      initialize-schema: never
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: pt_BR
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
