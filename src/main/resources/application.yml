server:
  # Railway: o dominio aponta para a porta do servico; PORT=8080 explicito la (mapa 2.1)
  port: ${PORT:8080}
  # Graceful do Tomcat (15 s) roda antes do destroy da fila (25 s) e da agenda (10 s); ver spring.lifecycle abaixo
  shutdown: graceful
  # XFF/XFP lidos a mao (ClienteIp, PaginaLimitOffset.https), em paridade com o DRF; sem RemoteIpValve
  forward-headers-strategy: none
management:
  endpoints:
    web:
      exposure:
        # sem /actuator/**: a URL cai no 404 do dispatcher, como no Django (mapa 2.6)
        exclude: "*"
      # a pagina de links do proprio /actuator tambem
      discovery:
        enabled: false
spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  application:
    name: clama-api
  jackson:
    time-zone: America/Sao_Paulo
  datasource:
    hikari:
      data-source-properties:
        # o Detail do Postgres traz o valor duplicado (e-mail); o Hibernate o loga em org.hibernate.orm.jdbc.error
        logServerErrorDetail: "false"
  servlet:
    multipart:
      # Django nao limita o upload no parser; quem recusa e o serializer (logo 250 KB, documento 100 MB)
      max-file-size: 100MB
      max-request-size: 101MB
      # parse no controller (nao no DispatcherServlet): o excesso vira o 400 do serializer de cada rota
      resolve-lazily: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # banco de producao ja existe (Django): baseline em 0 e so migrations aditivas por cima
    baseline-on-migrate: true
    baseline-version: "0"
clama:
  hosts:
    # ALLOWED_HOSTS (DJANGO_ALLOWED_HOSTS). Local: DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
    validar: true
  agenda:
    pedidos-presos:
      cron: "0 */10 * * * *"
      janela: PT20M
    # Django: crontab(minute=17, hour="*/6"). Comeca em LISTAR; so EXECUTAR depois de contar os pendentes >48 h em prod
    reconciliar-freemium:
      cron: "0 17 */6 * * *"
    # blog (mapa da etapa 6, secao 5). Sem .modo: quem altera dados (reconciliar-espelho, purgar-ips) comeca em
    # LISTAR, os que so leem (monitores e alerta) em EXECUTAR (R2, R6)
    reconciliar-espelho:
      cron: "0 */15 * * * *"
    monitorar-seo:
      cron: "0 */30 * * * *"
    verificar-urls:
      cron: "0 0 4 * * *"
    alerta-comentarios:
      cron: "0 0 8 * * *"
    purgar-ips:
      cron: "0 0 3 * * *"
  # MEDIA_ROOT do Django (FileSystemStorage): documents/<uuid>/<nome>
  media-root: ./media
  documentos:
    tamanho-maximo: 100MB # DocumentoContexto.MAX_FILE_SIZE
  fila:
    polling: 2s
    heartbeat: 20s # x6 perdidos (default do db-scheduler) = execucao morta retomada em ~2 min
