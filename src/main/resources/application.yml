server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d # deslizante: cada requisicao renova
      cookie:
        # Secure fica no automatico do Spring Session (segue request.isSecure(): https sim, http local nao)
        same-site: lax
        path: /api # so a API recebe a sessao (blog e paginas nao); o XSRF-TOKEN fica em / para o JS ler
        http-only: true
        # o navegador guarda por 30 dias; quem expira de fato e o servidor (7 dias sem uso)
        max-age: 30d

spring:
  datasource:
    hikari:
      data-source-properties:
        # sem estes timeouts o proxy publico do Railway ja travou uma conexao para sempre (incidente 2026-11-08)
        connectTimeout: "10"
        loginTimeout: "20"
        tcpKeepAlive: "true"
        logServerErrorDetail: "false"
  application:
    name: clama-api
  autoconfigure:
    # login manual (conta.LoginServico), sem UserDetailsService: sem isto o Boot cria um usuario com senha gerada.
    # Aqui e nao no @SpringBootApplication porque os slices (@WebMvcTest) tambem respeitam a propriedade
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  session:
    jdbc:
      initialize-schema: never
  data:
    web:
      pageable:
        max-page-size: 100 # PagedModel em JSON estavel: serialization-mode
        serialization-mode: via-dto
  servlet:
    multipart:
      max-file-size: 300KB # logo: o validador recusa >250 KB com texto proprio; isto e so a trava de rede
      max-request-size: 400KB
      file-size-threshold: 300KB # partes ficam em memoria: sem depender do diretorio temporario
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: pt_BR
    locale-resolver: fixed

# fila e tarefas recorrentes (D13). O stop() do scheduler roda no destroy do bean, DEPOIS das fases de lifecycle, e soma
# ao tempo delas: graceful do Tomcat (15 s) + jobs em andamento ate 2 x shutdown-max-wait (espera, interrompe, espera de
# novo) + ~6 s dos executores utilitarios = ~51 s, dentro dos 60 s de draining do Railway (FilaTest.shutdownCabeNoDraining)
db-scheduler:
  threads: 4
  polling-interval: 2s
  heartbeat-interval: 20s # 6 perdidos (2 min) = execucao morta, retomada por outro no
  shutdown-max-wait: 15s
  delay-startup-until-context-ready: true

springdoc:
  api-docs:
    enabled: false # liga em application-local.yml e nos testes; /v3/api-docs fora disso cai no denyAll

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false

clama:
  conta:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    admin-resgate-email: ${CLAMA_ADMIN_RESGATE_EMAIL:}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    remetente: ${DEFAULT_FROM_EMAIL:Clama <nao-responda@clama.me>}
  cripto:
    # 32 bytes em base64, sem default: sem a variavel o boot falha (so os perfis local e de teste trazem chave de dev).
    # A chave do HMAC e outra, de proposito. Gerar: openssl rand -base64 32
    chave: ${CLAMA_CRIPTO_CHAVE:}
    chave-hmac: ${CLAMA_HMAC_CHAVE:}
  pagamento:
    # piso do checkout (R$ 1,00); o pedido confere na criacao e o pagamento repete na cobranca
    valor-minimo-centavos: 100
    # vazio nao derruba o boot: o Pix responde 503 e loga o motivo
    mercadopago-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    # notification_url do Pix; so vai ao MP se for https (em dev local fica de fora, com aviso no log)
    webhook-url: ${BACKEND_PUBLIC_URL:}/api/webhooks/mercadopago
    # HMAC do x-signature; vazio fora de local/teste impede o boot (todo webhook seria recusado)
    webhook-segredo: ${MERCADOPAGO_WEBHOOK_SECRET:}
  repasse:
    percentual: 20 # fotografado em cada repasse registrado
  alerta:
    # alertas ao admin sem PII (D11): pagamento divergente/orfao, estorno de repasse transferido, falhas da oracao (4b)
    email-admin: ${CLAMA_ADMIN_ALERTA_EMAIL:contato@clama.me}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oracao:
    # vazio nao derruba o boot: a geracao falha com erro claro (ERROR no boot e Sentry fora de local/teste)
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    modelo: claude-sonnet-4-6 # o que roda hoje (mapa §3.2); trocar e decisao a parte (custo e prompt)
    max-tokens: 1500
    timeout: 30s # por tentativa; 3 tentativas (esperas 1 e 2 s) so em rede/timeout e 529
  turnstile:
    url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    secret: ${TURNSTILE_SECRET_KEY:}
