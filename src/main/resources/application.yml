spring:
  application:
    name: clama-api
  jackson:
    time-zone: America/Sao_Paulo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # banco de producao ja existe (Django): baseline em 0 e so migrations aditivas por cima
    baseline-on-migrate: true
    baseline-version: "0"
clama:
  fila:
    polling: 2s
    heartbeat: 1m
sentry:
  # o Django cria LoggingIntegration(level=None, event_level=None): log nao vira evento; captura so de excecao
  logging:
    enabled: false
